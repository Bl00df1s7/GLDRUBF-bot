name: GLDRUBF Auto Trading

on:
  schedule:
    # GitHub Actions uses UTC. Runs at 03:05-23:05 MSK on weekdays,
    # plus a final session check at 23:50 MSK.
    - cron: '5 0-20 * * 1-5'
    - cron: '50 20 * * 1-5'
  # Stage 6C: ручной запуск PAPER smoke-теста.
  # paper_smoke_test=false (по умолчанию) — обычный dry-run, ордера НЕ отправляются.
  # paper_smoke_test=true — полный PAPER прогон с AUTO_TRADING_ENABLED=true.
  # Stage 6D: execution-proof диагностика (scripts/paper_smoke_test.py):
  # diag_market / diag_margin / diag_broker добавляют флаги
  # --diag-market / --diag-margin / --diag-broker к команде прогона.
  # Флаги образуют ОДИН синтетический сценарий, поэтому работают только
  # все вместе: partial selection = fail closed (guard внутри скрипта +
  # проверка шага "Resolve run mode inputs" ниже). По умолчанию все три
  # выключены → обычное поведение не меняется.
  # LIVE здесь недоступен: TRADING_MODE жёстко зафиксирован в "PAPER".
  workflow_dispatch:
    inputs:
      paper_smoke_test:
        description: >-
          Run a full PAPER smoke test with AUTO_TRADING_ENABLED=true
          (simulated orders only; LIVE is never allowed in this workflow).
        type: boolean
        default: false
      diag_market:
        description: >-
          DIAGNOSTIC ONLY (requires paper_smoke_test=true): pass
          --diag-market to scripts/paper_smoke_test.py — deterministic
          fixture candles + tight order book at the network boundary.
          Must be combined with diag_margin AND diag_broker (all-or-nothing;
          partial selection fails closed). c5_core / sizing / guards stay REAL.
        type: boolean
        default: false
      diag_margin:
        description: >-
          DIAGNOSTIC ONLY (requires paper_smoke_test=true): pass
          --diag-margin — fake ГО/margin tracker injected via the existing
          C5Runtime ctor DI hook (Stage 5B rates). Must be combined with
          diag_market AND diag_broker (all-or-nothing; partial selection
          fails closed).
        type: boolean
        default: false
      diag_broker:
        description: >-
          DIAGNOSTIC ONLY (requires paper_smoke_test=true): pass
          --diag-broker — seed the REAL PaperExecutionAdapter +
          SimulatedBroker from a real read-only account snapshot. Must be
          combined with diag_market AND diag_margin (all-or-nothing; partial
          selection fails closed). LIVE execution is never affected.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gldrubf-auto-trading
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Сервер opensource.tbank.ru (PyPI-индекс T-Invest SDK) и
      # invest-public-api.tbank.ru выдают сертификаты, выпущенные «Russian Trusted
      # Sub CA» (МИДцифры). Корень этой ЦС отсутствует в стандартном хранилище CA
      # на ubuntu-latest и в certifi, поэтому pip падает с
      # CERTIFICATE_VERIFY_FAILED. Решение — добавить сертификат Russian Trusted CA
      # (из certs/) в доверяемое хранилище. Проверку TLS мы НЕ отключаем
      # (--trusted-host не используем).
      - name: Trust Russian Trusted CA for tbank hosts
        run: |
          sudo cp certs/russian-trusted-sub-ca.pem \
                  certs/russian-trusted-root-ca.pem \
                  /usr/local/share/ca-certificates/
          sudo update-ca-certificates
          # pip может использовать certifi вместо системного хранилища —
          # собираем объединённый CA-бандл и указываем его для pip и requests
          bundle="$(python tools/pip_ca_bundle.py)"
          echo "PIP_CERT=${bundle}" >> "$GITHUB_ENV"
          echo "REQUESTS_CA_BUNDLE=${bundle}" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=${bundle}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Stage 6C: карта входов workflow_dispatch -> env-флаги. Только PAPER;
      # LIVE не может быть выбран никогда (нет соответствующего входа).
      # Stage 6D: плюс all-or-nothing guard для диагностических входов
      # diag_market / diag_margin / diag_broker (см. scripts/paper_smoke_test.py).
      - name: Resolve run mode inputs
        id: run_mode
        env:
          PAPER_SMOKE_TEST: ${{ github.event.inputs.paper_smoke_test }}
          DIAG_MARKET: ${{ github.event.inputs.diag_market }}
          DIAG_MARGIN: ${{ github.event.inputs.diag_margin }}
          DIAG_BROKER: ${{ github.event.inputs.diag_broker }}
        run: |
          raw="${PAPER_SMOKE_TEST:-false}"
          case "$raw" in
            true|1|yes|on)  auto="true" ;;
            false|""|*)     auto="false" ;;
          esac
          echo "auto_trading_enabled=${auto}" >> "$GITHUB_OUTPUT"

          # --- Stage 6D: нормализация диагностических входов -------------
          norm() {
            case "${1:-false}" in
              true|1|yes|on) echo true ;;
              *)             echo false ;;
            esac
          }
          d_market="$(norm "$DIAG_MARKET")"
          d_margin="$(norm "$DIAG_MARGIN")"
          d_broker="$(norm "$DIAG_BROKER")"
          selected=$((0))
          [ "$d_market" = true ] && selected=$((selected+1))
          [ "$d_margin" = true ] && selected=$((selected+1))
          [ "$d_broker" = true ] && selected=$((selected+1))

          # ALL-OR-NOTHING guard (workflow-side mirror of the script's own
          # fail-closed check): the three diagnostics form ONE coherent
          # synthetic scenario, so partial selection is rejected BEFORE the
          # smoke test even starts. Scheduled runs and plain dispatches have
          # selected=0 → untouched legacy behaviour.
          if [ "$selected" -ne 0 ] && [ "$selected" -ne 3 ]; then
            echo "::error::FAIL CLOSED: diag_market, diag_margin and diag_broker must be used together (all three or none). Selected: ${selected}."
            exit 1
          fi
          # Diagnostics only make sense inside a full PAPER smoke run
          # (AUTO_TRADING_ENABLED=true); otherwise nothing would execute.
          if [ "$selected" -eq 3 ] && [ "$auto" != "true" ]; then
            echo "::error::FAIL CLOSED: diagnostic flags require paper_smoke_test=true."
            exit 1
          fi

          diag_args=""
          if [ "$selected" -eq 3 ]; then
            # Deterministic reproducible proof run: fixed clock at the
            # 16:05 MSK control point + throwaway state file (same command
            # as documented in scripts/paper_smoke_test.py). The state file
            # is a temp path that does NOT touch the cached runtime state.
            diag_args="--clock-epoch \"2026-10-02T16:05:00+03:00\" --fresh-state --diag-market --diag-margin --diag-broker"
          fi
          echo "diag_args=${diag_args}" >> "$GITHUB_OUTPUT"

          # Логирование конфигурации — намеренно БЕЗ секретов (только режимы).
          echo "TRADING_MODE=PAPER (LIVE is never allowed in this workflow)"
          echo "AUTO_TRADING_ENABLED=${auto} (paper_smoke_test=${raw:-false})"
          echo "diagnostics: diag_market=${d_market} diag_margin=${d_margin} diag_broker=${d_broker} (all-or-nothing, selected=${selected}/3)"

      - name: Restore runtime state
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: gldrubf-runtime-${{ github.run_id }}
          restore-keys: |
            gldrubf-runtime-

      - name: Run strategy
        env:
          T_SANDAPI: ${{ secrets.T_SANDAPI }}
          # Stage 6B: explicit trading mode — MANDATORY since Stage 5A
          # (src/runtime_config.py fails closed on missing/blank mode).
          # PAPER only here; LIVE requires a separate deliberate change.
          TRADING_MODE: "PAPER"
          # Stage 6C: AUTO_TRADING_ENABLED driven by the paper_smoke_test
          # workflow_dispatch input (default false → dry-run as before).
          # Scheduled runs have no input → always "false". LIVE is never
          # reachable from this workflow: TRADING_MODE stays hard-coded
          # to "PAPER" above.
          AUTO_TRADING_ENABLED: ${{ steps.run_mode.outputs.auto_trading_enabled }}
          # Stage 6D: fixed diagnostic flag list built by "Resolve run mode
          # inputs" — EMPTY unless all three diag_* inputs are selected
          # (all-or-nothing guard in that step). Not user-controlled text.
          DIAG_ARGS: ${{ steps.run_mode.outputs.diag_args }}
          TELEGRAM_ENABLED: "false"
          STATE_FILE: ${{ github.workspace }}/runtime/state.json
          TRADES_FILE: ${{ github.workspace }}/runtime/trades.csv
          LOG_DIR: ${{ github.workspace }}/runtime/logs
        run: |
          mkdir -p runtime/logs
          if [ "${AUTO_TRADING_ENABLED}" = "true" ]; then
            # Stage 6C: полный PAPER smoke-прогон (scripts/paper_smoke_test.py).
            # Stage 6D: DIAG_ARGS пустой, если диагностические входы не
            # выбраны → команда ровно та же, что и раньше. Если выбраны все
            # три — добавляются --clock-epoch/--fresh-state/--diag-* (см.
            # шаг "Resolve run mode inputs"; частичный набор отклоняется там
            # же, fail closed). TRADING_MODE жёстко PAPER — LIVE недостижим.
            # shellcheck disable=SC2086  # intentional word-splitting of fixed flag list
            python3 scripts/paper_smoke_test.py ${DIAG_ARGS:-}
          else
            python -m src.main
          fi

      - name: Show run log
        if: always()
        run: |
          for log_file in runtime/logs/bot_*.log; do
            [ -f "$log_file" ] && cat "$log_file"
          done

      - name: Save runtime state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: gldrubf-runtime-${{ github.run_id }}
