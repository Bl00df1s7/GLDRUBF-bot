name: GLDRUBF Auto Trading

on:
  schedule:
    # GitHub Actions uses UTC: 03:01, 07:01, ... MSK = 00:01, 04:01, ... UTC.
    - cron: '1 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gldrubf-auto-trading
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore runtime state
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: gldrubf-runtime-${{ github.run_id }}
          restore-keys: |
            gldrubf-runtime-

      - name: Run strategy
        env:
          T_SANDAPI: ${{ secrets.T_SANDAPI }}
          AUTO_TRADING_ENABLED: "true"
          TELEGRAM_ENABLED: "false"
          STATE_FILE: ${{ github.workspace }}/runtime/state.json
          TRADES_FILE: ${{ github.workspace }}/runtime/trades.csv
          LOG_DIR: ${{ github.workspace }}/runtime/logs
        run: |
          mkdir -p runtime/logs
          python -m src.main

      - name: Save runtime state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: gldrubf-runtime-${{ github.run_id }}
