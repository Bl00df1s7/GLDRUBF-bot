name: GLDRUBF Auto Trading

on:
  schedule:
    # GitHub Actions uses UTC. Runs at 03:05-23:05 MSK on weekdays,
    # plus a final session check at 23:50 MSK.
    - cron: '5 0-20 * * 1-5'
    - cron: '50 20 * * 1-5'
  workflow_dispatch:
    inputs:
      # Stage 6C: explicit opt-in for the real-data PAPER smoke test.
      # Default false => AUTO_TRADING_ENABLED=false (no execution).
      # true       => AUTO_TRADING_ENABLED=true, but TRADING_MODE stays
      # hard-coded to "PAPER" below. LIVE is never reachable from here.
      paper_smoke_test:
        description: "Run real-data PAPER smoke test (execution via PaperExecutionAdapter only; post_order calls = 0)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gldrubf-auto-trading
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Сервер opensource.tbank.ru (PyPI-индекс T-Invest SDK) и
      # invest-public-api.tbank.ru выдают сертификаты, выпущенные «Russian Trusted
      # Sub CA» (МИДцифры). Корень этой ЦС отсутствует в стандартном хранилище CA
      # на ubuntu-latest и в certifi, поэтому pip падает с
      # CERTIFICATE_VERIFY_FAILED. Решение — добавить сертификат Russian Trusted CA
      # (из certs/) в доверяемое хранилище. Проверку TLS мы НЕ отключаем
      # (--trusted-host не используем).
      - name: Trust Russian Trusted CA for tbank hosts
        run: |
          sudo cp certs/russian-trusted-sub-ca.pem \
                  certs/russian-trusted-root-ca.pem \
                  /usr/local/share/ca-certificates/
          sudo update-ca-certificates
          # pip может использовать certifi вместо системного хранилища —
          # собираем объединённый CA-бандл и указываем его для pip и requests
          bundle="$(python tools/pip_ca_bundle.py)"
          echo "PIP_CERT=${bundle}" >> "$GITHUB_ENV"
          echo "REQUESTS_CA_BUNDLE=${bundle}" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=${bundle}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore runtime state
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: gldrubf-runtime-${{ github.run_id }}
          restore-keys: |
            gldrubf-runtime-

      - name: Run strategy
        env:
          T_SANDAPI: ${{ secrets.T_SANDAPI }}
          # Stage 6B: explicit trading mode — MANDATORY since Stage 5A
          # (src/runtime_config.py fails closed on missing/blank mode).
          # PAPER only here; LIVE requires a separate deliberate change.
          # Stage 6C: TRADING_MODE is hard-coded "PAPER" even when the
          # paper_smoke_test input is true — the input can NEVER enable LIVE.
          TRADING_MODE: "PAPER"
          # LIVE SAFETY GATE: auto-trading stays disabled for every normal
          # run (schedule/push/dispatch without the flag). It becomes "true"
          # ONLY on an explicit manual workflow_dispatch with
          # paper_smoke_test=true, and even then execution goes through
          # PaperExecutionAdapter because TRADING_MODE above is "PAPER".
          AUTO_TRADING_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.paper_smoke_test && 'true' || 'false' }}
          TELEGRAM_ENABLED: "false"
          STATE_FILE: ${{ github.workspace }}/runtime/state.json
          TRADES_FILE: ${{ github.workspace }}/runtime/trades.csv
          LOG_DIR: ${{ github.workspace }}/runtime/logs
        run: |
          mkdir -p runtime/logs
          # Safe config echo only — never print T_SANDAPI or any secret value.
          echo "TRADING_MODE=${TRADING_MODE}"
          echo "PAPER_SMOKE_TEST=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.paper_smoke_test || false }}"
          echo "AUTO_TRADING_ENABLED=${AUTO_TRADING_ENABLED}"
          python -m src.main

      - name: Show run log
        if: always()
        run: |
          for log_file in runtime/logs/bot_*.log; do
            [ -f "$log_file" ] && cat "$log_file"
          done

      - name: Save runtime state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: gldrubf-runtime-${{ github.run_id }}
